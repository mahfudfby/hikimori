    <!-- ═══ Intro minimalis (±1,5 dtk, tampil di setiap reload): logo → HIKIMORI → nama, lalu tirai terbuka ═══ -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#EEF4FA;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;--ez:cubic-bezier(.22,1,.36,1)}

      #intro .pane.t{top:0}#intro .pane.b{bottom:0}
      #intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,22px);transition:transform .9s var(--ez),opacity .5s ease}
      #intro .mark{width:clamp(120px,22vw,180px);height:auto;opacity:0;transform:scale(.92);animation:inUp .7s var(--ez) .05s forwards}
      #intro .word{font-weight:600;font-size:clamp(1.6rem,5.5vw,2.6rem);letter-spacing:.32em;margin-right:-.32em;line-height:1;opacity:0;animation:inUp .7s var(--ez) .25s forwards}
      #intro .word b{color:#F4D58A;font-weight:600}
      #intro .line{width:min(220px,50vw);height:1px;background:linear-gradient(90deg,transparent,rgba(238,244,250,.6),transparent);transform:scaleX(0);animation:draw .8s var(--ez) .45s forwards}
      #intro .sub{font:500 clamp(.72rem,2.6vw,.85rem)/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase;color:rgba(238,244,250,.6);opacity:0;animation:inUp .7s var(--ez) .6s forwards}
      #intro.out .pane.t{transform:translateY(-101%)}#intro.out .pane.b{transform:translateY(101%)}
      #intro.out .stage{transform:scale(1.04);opacity:0}
      #intro.out{pointer-events:none}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      @keyframes inUp{to{opacity:1;transform:none}}
      @keyframes draw{to{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.2s!important}}

    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Tampil di setiap reload; minimal 1,4 dtk agar logo & nama sempat terbaca
        var MIN = reduce ? 300 : 1400, t0 = performance.now(), ready = false, done = false, scheduled = false;
        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1000);
        }
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 6000); // pengaman bila JS aplikasi gagal dimuat
      })();
    </script>
