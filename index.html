    <!-- Catatan: jangan animasikan filter/blur pada logo — Safari iOS merendernya jadi kotak putih. -->
    <!-- ═══ Intro "lensa auto-focus" (±5,6 dtk, tiap reload): bracket cetak biru maju-mundur mencari fokus → kunci → logo zoom & berkilau.
         Ringan: hanya CSS transform/opacity, tanpa canvas, tanpa animasi filter. ═══ -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#EEF4FA;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;--ez:cubic-bezier(.22,1,.36,1);--gold:#F4D58A;--gold2:#C9971C;--cy:#9EE6F2;--lock:2.4s}
      #intro .pane{position:absolute;top:0;bottom:0;width:50.5%;background:#0A0C14;overflow:hidden;transition:transform 1s cubic-bezier(.76,0,.24,1)}
      #intro .pane.l{left:0}#intro .pane.r{right:0}
      /* aurora tipis: pita cahaya lembut yang melayang (gradien sudah lembut, tanpa filter) */
      #intro .aur{position:absolute;inset:0;pointer-events:none;opacity:0;animation:hkIn 2s ease .1s forwards}
      #intro .aur i{position:absolute;left:-30%;width:160%;height:34vh;border-radius:50%;opacity:.9;will-change:transform;
        -webkit-mask:radial-gradient(50% 50% at 50% 50%,#000 20%,transparent 72%);mask:radial-gradient(50% 50% at 50% 50%,#000 20%,transparent 72%)}
      #intro .aur i:nth-child(1){top:8%;background:linear-gradient(90deg,transparent 5%,rgba(201,151,28,.20) 30%,rgba(244,213,138,.16) 50%,rgba(158,230,242,.10) 70%,transparent 95%);transform:rotate(-14deg);animation:float1 9s ease-in-out infinite alternate}
      #intro .aur i:nth-child(2){top:52%;background:linear-gradient(90deg,transparent 5%,rgba(158,230,242,.14) 35%,rgba(188,174,246,.10) 55%,rgba(201,151,28,.10) 75%,transparent 95%);transform:rotate(10deg);animation:float2 11s ease-in-out infinite alternate}
      #intro .aur i:nth-child(3){top:30%;height:20vh;background:linear-gradient(90deg,transparent 10%,rgba(244,213,138,.10) 45%,rgba(158,230,242,.08) 60%,transparent 90%);transform:rotate(-4deg);animation:float3 13s ease-in-out infinite alternate}
      /* grid cetak biru, memudar ke tepi */
      #intro .grid{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;-webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);animation:hkIn 1s ease .05s forwards}
      /* garis grid di lapisan sendiri yang digeser via transform (komposit GPU, tanpa repaint layar penuh tiap frame) */
      #intro .grid::before{content:"";position:absolute;top:-44px;left:-44px;right:0;bottom:0;background:linear-gradient(rgba(158,230,242,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(158,230,242,.07) 1px,transparent 1px) 0 0/44px 44px;will-change:transform;animation:gridPan 6s linear infinite}
      /* sudut HUD layar */
      #intro .hud{position:absolute;inset:clamp(14px,3vw,28px);pointer-events:none}
      #intro .hud i{position:absolute;width:22px;height:22px;border:1px solid rgba(244,213,138,.5);opacity:0;animation:hudIn .7s var(--ez) forwards}
      #intro .hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;animation-delay:.15s}
      #intro .hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;animation-delay:.22s}
      #intro .hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;animation-delay:.29s}
      #intro .hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;animation-delay:.36s}
      #intro .hud span{position:absolute;font:500 .6rem/1 ui-monospace,Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:rgba(158,230,242,.6);opacity:0;animation:hkIn .8s ease .5s forwards}
      #intro .hud .tl{left:34px;top:6px}#intro .hud .br{right:34px;bottom:6px;color:rgba(244,213,138,.65)}
      #intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,20px);transition:transform 1s var(--ez),opacity .6s ease}
      /* ── Bidikan: bracket mencari fokus (maju-mundur meredam) lalu mengunci ── */
      #intro .emblem{position:relative;width:clamp(180px,32vw,240px);aspect-ratio:1;display:grid;place-items:center}
      #intro .focus{position:absolute;inset:0;transform:scale(1.55);opacity:0;animation:hkIn .6s ease .15s forwards,hunt 2.25s linear .15s forwards}
      #intro .focus b{position:absolute;width:22%;height:22%;border:2px solid var(--gold);opacity:.75;animation:lockFlash .5s ease var(--lock) forwards}
      #intro .focus b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:4px}
      #intro .focus b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:4px}
      #intro .focus b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:4px}
      #intro .focus b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:4px}
      /* garis bidik tengah & kotak dalam putus-putus */
      #intro .reticle{position:absolute;inset:-8%;pointer-events:none;opacity:0;animation:hkIn .6s ease .4s forwards}
      #intro .reticle i{position:absolute;background:rgba(158,230,242,.5)}
      #intro .reticle i:nth-child(1){left:50%;top:0;width:1px;height:9%}#intro .reticle i:nth-child(2){left:50%;bottom:0;width:1px;height:9%}
      #intro .reticle i:nth-child(3){top:50%;left:0;height:1px;width:9%}#intro .reticle i:nth-child(4){top:50%;right:0;height:1px;width:9%}
      #intro .inner{position:absolute;inset:13%;border:1px dashed rgba(158,230,242,.4);opacity:0;animation:hkIn .5s ease var(--lock) forwards}
      #intro .af{position:absolute;left:0;top:-1.6em;font:600 .6rem/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:rgba(158,230,242,.75)}
      #intro .af::before{content:"AF ···";animation:afBlink .5s steps(1) 4 .2s}
      #intro .af::after{content:"";position:absolute;left:0;top:0;white-space:nowrap;color:var(--gold);opacity:0;animation:hkIn .2s ease var(--lock) forwards}
      #intro .af.locked::before{content:""}#intro .af.locked::after{content:"AF ● LOCK"}
      /* logo: samar saat dicari, lalu zoom maju setelah terkunci dan berkilau */
      #intro .mark{position:relative;width:62%;overflow:hidden;opacity:0;transform:scale(.86);animation:seek 2.1s ease .25s forwards,zoomIn 1s cubic-bezier(.2,1.25,.35,1) var(--lock) forwards}
      #intro .mark img{display:block;width:100%;height:auto}
      #intro .mark::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,244,200,.8) 50%,transparent 60%);opacity:0;animation:glint 1s ease-in-out calc(var(--lock) + .55s) forwards}
      /* wordmark: tiap huruf naik dari balik masker */
      #intro .word{display:flex;font-weight:700;font-size:clamp(1.9rem,7vw,3.2rem);letter-spacing:.3em;margin-right:-.3em;line-height:1}
      #intro .word span{display:inline-block;overflow:hidden;padding:.08em 0}
      #intro .word i{display:inline-block;font-style:normal;transform:translateY(110%);animation:rise .75s var(--ez) calc(2.75s + var(--i) * 60ms) forwards}
      #intro .word i.g{color:var(--gold);text-shadow:0 0 18px rgba(244,213,138,.35)}
      #intro .line{width:min(300px,62vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--cy),transparent);transform:scaleX(0);animation:draw .9s var(--ez) 3.35s forwards}
      /* nama: muncul (tanpa gerak huruf), lalu zoom halus + silau emas di akhir */
      #intro .sub{display:flex;font:600 clamp(.78rem,3vw,1rem)/1 ui-monospace,Consolas,monospace;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase}
      #intro .sub{--z:1.4;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;transform:translateZ(0);animation:nameZoom 1.6s cubic-bezier(.16,1,.3,1) 4.3s forwards}@media (max-width:480px){#intro .sub{--z:1.16}}
      #intro .sub i{display:inline-block;font-style:normal;min-width:.45em;opacity:0;animation:hkIn .5s ease calc(3.55s + var(--i) * 25ms) forwards,nameGlint .9s ease-in-out calc(4.45s + var(--i) * 40ms) both}
      #intro .role{font-size:clamp(.7rem,2.5vw,.82rem);letter-spacing:.18em;text-transform:uppercase;color:rgba(238,244,250,.55);opacity:0;animation:hkIn .8s ease 4.1s forwards}
      /* bilah progres bawah */
      #intro .prog{position:absolute;left:50%;bottom:clamp(36px,7vh,60px);width:min(220px,54vw);height:2px;margin-left:calc(min(220px,54vw) / -2);background:rgba(158,230,242,.12);border-radius:2px;overflow:hidden;opacity:0;animation:hkIn .6s ease .4s forwards}
      #intro .prog b{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--cy));transform:scaleX(0);transform-origin:0 50%;animation:draw 5.2s cubic-bezier(.4,0,.2,1) .2s forwards}
      #intro .seam{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0;pointer-events:none}
      /* keluar: tirai terbelah kiri-kanan, kilat emas di sambungan */
      #intro.out .pane.l{transform:translateX(-101%)}#intro.out .pane.r{transform:translateX(101%)}
      #intro.out .seam{animation:seam .7s ease forwards}
      #intro.out .stage{transform:scale(1.08);opacity:0}
      #intro.out .hud,#intro.out .prog,#intro.out .grid,#intro.out .aur{opacity:0!important;transition:opacity .5s ease}
      #intro.out{pointer-events:none}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      @keyframes hkIn{to{opacity:1}}
      @keyframes hudIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
      /* lensa mencari fokus: satu tarikan maju-mundur yang pelan & halus, tanpa memantul, berhenti tepat 1 */
      @keyframes hunt{0%{transform:scale(1.55);animation-timing-function:cubic-bezier(.45,0,.25,1)}48%{transform:scale(.93);animation-timing-function:cubic-bezier(.45,0,.25,1)}80%{transform:scale(1.035);animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:scale(1)}}
      @keyframes lockFlash{0%{opacity:.75;border-color:var(--gold)}30%{opacity:1;border-color:#FFF4C8;box-shadow:0 0 12px rgba(244,213,138,.6)}100%{opacity:1;border-color:var(--gold);box-shadow:none}}
      @keyframes afBlink{50%{opacity:.2}}
      /* logo "mencari": samar, sedikit naik-turun skalanya mengikuti bracket */
      @keyframes seek{0%{opacity:0;transform:scale(.86)}30%{opacity:.45;transform:scale(.92)}60%{opacity:.5;transform:scale(.88)}100%{opacity:.55;transform:scale(.9)}}
      /* setelah terkunci: zoom maju melewati ukuran lalu mantap di 1 */
      @keyframes zoomIn{0%{opacity:.55;transform:scale(.9)}55%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
      @keyframes glint{0%{opacity:1;transform:translateX(-80%)}85%{opacity:1}100%{opacity:0;transform:translateX(80%)}}
      @keyframes rise{to{transform:none}}
      @keyframes draw{to{transform:scaleX(1)}}
      @keyframes nameZoom{to{transform:translateZ(0) scale(var(--z))}}
      @keyframes nameGlint{0%,100%{color:inherit;text-shadow:none}50%{color:#FFF4C8;text-shadow:0 0 14px rgba(244,213,138,.7)}}
      @keyframes seam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
      @keyframes gridPan{to{transform:translate(44px,44px)}}
      @keyframes float1{0%{transform:rotate(-14deg) translate(-6%,0) scaleY(1)}50%{transform:rotate(-10deg) translate(2%,4vh) scaleY(1.25)}100%{transform:rotate(-16deg) translate(8%,-2vh) scaleY(.9)}}
      @keyframes float2{0%{transform:rotate(10deg) translate(6%,0) scaleY(1)}50%{transform:rotate(6deg) translate(-3%,-5vh) scaleY(1.3)}100%{transform:rotate(12deg) translate(-8%,2vh) scaleY(.85)}}
      @keyframes float3{0%{transform:rotate(-4deg) translate(0,0)}100%{transform:rotate(3deg) translate(-6%,6vh) scaleY(1.4)}}
      @media (prefers-reduced-motion:reduce){#intro *,#intro *::before,#intro *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.2s!important}}

        <div class="role">Human Resources &amp; Administration</div>
      </div>
      <div class="prog"><b></b></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Huruf dipecah per span agar bisa muncul bergiliran (--i = urutan)
        function split(id, txt, gold) {
          var box = document.getElementById(id);
          for (var i = 0; i < txt.length; i++) {
            var s = document.createElement('span'), c = document.createElement('i');
            c.textContent = txt[i] === ' ' ? ' ' : txt[i]; c.style.setProperty('--i', i);
            if (i === gold) c.className = 'g';
            s.appendChild(c); box.appendChild(s);
          }
        }
        split('intro-word', 'HIKIMORI', 4);
        split('intro-sub', 'Mahfud Febry Styanto', -1);
        // Label lensa berganti "AF ● LOCK" saat bracket mengunci (sinkron dengan --lock 2,4 dtk)
        setTimeout(function () { var af = document.getElementById('intro-af'); af && af.classList.add('locked'); }, reduce ? 0 : 2400);
        // Tampil di setiap reload; minimal ±5 dtk agar seluruh rangkaian sempat terlihat
        var MIN = reduce ? 400 : 5600, t0 = performance.now(), ready = false, done = false, scheduled = false;
        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1100);
        }
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 10000); // pengaman bila JS aplikasi gagal dimuat
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
