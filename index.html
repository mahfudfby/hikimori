    <!-- Catatan: jangan animasikan filter/blur pada logo — Safari iOS merendernya jadi kotak putih. -->
    <!-- ═══ Intro motion graphic "cetak biru emas" (±4 dtk, tiap reload). Ringan: hanya CSS transform/opacity + SVG stroke, tanpa canvas ═══ -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#EEF4FA;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;--ez:cubic-bezier(.22,1,.36,1);--gold:#F4D58A;--gold2:#C9971C;--cy:#9EE6F2}
      #intro .pane{position:absolute;top:0;bottom:0;width:50.5%;background:#0A0C14;overflow:hidden;transition:transform 1s cubic-bezier(.76,0,.24,1)}
      #intro .pane.l{left:0}#intro .pane.r{right:0}
      /* aurora lembut yang bergeser pelan (hanya transform) */
      #intro .aur{position:absolute;inset:-20%;pointer-events:none;opacity:0;animation:hkIn 1.6s ease .1s forwards}
      #intro .aur i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(40px);opacity:.55;will-change:transform}
      #intro .aur i:nth-child(1){left:10%;top:5%;background:radial-gradient(circle,rgba(201,151,28,.35),transparent 65%);animation:drift1 7s ease-in-out infinite alternate}
      #intro .aur i:nth-child(2){right:5%;bottom:0;background:radial-gradient(circle,rgba(158,230,242,.22),transparent 65%);animation:drift2 8s ease-in-out infinite alternate}
      /* grid cetak biru, memudar ke tepi */
      #intro .grid{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(rgba(158,230,242,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(158,230,242,.07) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);animation:hkIn 1s ease .05s forwards,gridPan 6s linear infinite}
      /* sudut HUD */
      #intro .hud{position:absolute;inset:clamp(14px,3vw,28px);pointer-events:none}
      #intro .hud i{position:absolute;width:22px;height:22px;border:1px solid rgba(244,213,138,.55);opacity:0;animation:hudIn .7s var(--ez) forwards}
      #intro .hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;animation-delay:.2s}
      #intro .hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;animation-delay:.28s}
      #intro .hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;animation-delay:.36s}
      #intro .hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;animation-delay:.44s}
      #intro .hud span{position:absolute;font:500 .6rem/1 ui-monospace,Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:rgba(158,230,242,.6);opacity:0;animation:hkIn .8s ease .6s forwards}
      #intro .hud .tl{left:34px;top:6px}#intro .hud .br{right:34px;bottom:6px;color:rgba(244,213,138,.65)}
      #intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,20px);transition:transform 1s var(--ez),opacity .6s ease,filter .6s ease}
      /* cincin SVG: digambar lalu berputar pelan */
      #intro .emblem{position:relative;width:clamp(170px,30vw,230px);aspect-ratio:1;display:grid;place-items:center}
      #intro .rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
      #intro .rings circle{fill:none;stroke-linecap:round}
      #intro .rings .r1{stroke:url(#hkGold);stroke-width:1.4;stroke-dasharray:302;stroke-dashoffset:302;animation:ringDraw 1.3s var(--ez) .1s forwards}
      #intro .rings .r2{stroke:rgba(158,230,242,.45);stroke-width:1;stroke-dasharray:4 7;opacity:0;animation:hkIn .9s ease .5s forwards}
      #intro .rings .r3{stroke:rgba(244,213,138,.35);stroke-width:1;stroke-dasharray:40 210;stroke-dashoffset:0;opacity:0;animation:hkIn .6s ease .9s forwards}
      #intro .spin{transform-origin:50% 50%;animation:spin 14s linear infinite}
      #intro .spin.rev{animation-duration:9s;animation-direction:reverse}
      /* logo: terbuka dari bawah, tajam dari blur, lalu kilau emas menyapu */
      #intro .mark{position:relative;width:62%;overflow:hidden;clip-path:inset(100% 0 0 0);animation:clipUp .9s var(--ez) .35s forwards}
      #intro .mark img{display:block;width:100%;height:auto;opacity:0;transform:scale(1.12);animation:sharp 1s var(--ez) .35s forwards}
      #intro .mark::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,244,200,.75) 50%,transparent 60%);opacity:0;animation:glint 1s ease-in-out 1.25s forwards}
      /* wordmark: tiap huruf naik dari balik masker */
      #intro .word{display:flex;font-weight:700;font-size:clamp(1.9rem,7vw,3.2rem);letter-spacing:.3em;margin-right:-.3em;line-height:1}
      #intro .word span{display:inline-block;overflow:hidden;padding:.08em 0}
      #intro .word i{display:inline-block;font-style:normal;transform:translateY(110%);animation:rise .75s var(--ez) calc(.9s + var(--i) * 60ms) forwards}
      #intro .word i.g{color:var(--gold);text-shadow:0 0 18px rgba(244,213,138,.35)}
      #intro .line{width:min(300px,62vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--cy),transparent);transform:scaleX(0);animation:draw .9s var(--ez) 1.5s forwards}
      #intro .sub{display:flex;font:600 clamp(.78rem,3vw,1rem)/1 ui-monospace,Consolas,monospace;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase}
      #intro .sub{--z:1.4;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;transform:translateZ(0);animation:nameZoom 1.6s cubic-bezier(.16,1,.3,1) 2.55s forwards}@media (max-width:480px){#intro .sub{--z:1.16}}
      #intro .sub i{display:inline-block;font-style:normal;min-width:.45em;opacity:0;animation:hkIn .5s ease calc(1.8s + var(--i) * 25ms) forwards,nameGlint .9s ease-in-out calc(2.7s + var(--i) * 40ms) both}
      #intro .role{font-size:clamp(.7rem,2.5vw,.82rem);letter-spacing:.18em;text-transform:uppercase;color:rgba(238,244,250,.55);opacity:0;animation:hkIn .8s ease 2.45s forwards}
      /* bilah progres bawah */
      #intro .prog{position:absolute;left:50%;bottom:clamp(36px,7vh,60px);width:min(220px,54vw);height:2px;margin-left:calc(min(220px,54vw) / -2);background:rgba(158,230,242,.12);border-radius:2px;overflow:hidden;opacity:0;animation:hkIn .6s ease .4s forwards}
      #intro .prog b{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--cy));transform:scaleX(0);transform-origin:0 50%;animation:draw 3s cubic-bezier(.4,0,.2,1) .2s forwards}
      #intro .seam{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0;pointer-events:none}
      /* keluar: tirai terbelah kiri-kanan, kilat emas di sambungan */
      #intro.out .pane.l{transform:translateX(-101%)}#intro.out .pane.r{transform:translateX(101%)}
      #intro.out .seam{animation:seam .7s ease forwards}
      #intro.out .stage{transform:scale(1.08);opacity:0;filter:blur(6px)}
      #intro.out .hud,#intro.out .prog,#intro.out .grid,#intro.out .aur{opacity:0!important;transition:opacity .5s ease}
      #intro.out{pointer-events:none}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      /* HP / mode hemat: tanpa blur (paling berat), gerak tetap */
      html.lite #intro .aur i{filter:none;opacity:.35}
      html.lite #intro.out .stage{filter:none}
      @keyframes hkIn{to{opacity:1}}
      @keyframes hkUp{to{opacity:1;transform:none}}
      @keyframes hudIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
      @keyframes ringDraw{to{stroke-dashoffset:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes clipUp{to{clip-path:inset(0 0 0 0)}}
      @keyframes sharp{to{opacity:1;transform:none}}
      @keyframes glint{0%{opacity:1;transform:translateX(-80%)}85%{opacity:1}100%{opacity:0;transform:translateX(80%)}}
      @keyframes rise{to{transform:none}}
      @keyframes draw{to{transform:scaleX(1)}}
      @keyframes nameZoom{to{transform:translateZ(0) scale(var(--z))}}
      @keyframes nameGlint{0%,100%{color:inherit;text-shadow:none}50%{color:#FFF4C8;text-shadow:0 0 14px rgba(244,213,138,.7)}}
      @keyframes seam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
      @keyframes gridPan{to{background-position:0 44px,44px 0}}
      @keyframes drift1{to{transform:translate(8%,6%) scale(1.1)}}
      @keyframes drift2{to{transform:translate(-8%,-5%) scale(1.15)}}
      @media (prefers-reduced-motion:reduce){#intro *,#intro *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.2s!important}}
    </style>

    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Huruf dipecah per span agar bisa muncul bergiliran (--i = urutan)
        function split(id, txt, gold) {
          var box = document.getElementById(id);
          for (var i = 0; i < txt.length; i++) {
            var s = document.createElement('span'), c = document.createElement('i');
            c.textContent = txt[i] === ' ' ? ' ' : txt[i]; c.style.setProperty('--i', i);
            if (i === gold) c.className = 'g';
            s.appendChild(c); box.appendChild(s);
          }
        }
        split('intro-word', 'HIKIMORI', 4);
        split('intro-sub', 'Mahfud Febry Styanto', -1);
        // Tampil di setiap reload; minimal ±3,4 dtk agar seluruh rangkaian sempat terlihat
        var MIN = reduce ? 400 : 4000, t0 = performance.now(), ready = false, done = false, scheduled = false;
        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1100);
        }
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 8000); // pengaman bila JS aplikasi gagal dimuat
      })();
    </script>
