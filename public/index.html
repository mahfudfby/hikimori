    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var LITE = root.classList.contains('lite');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Intro penuh hanya sekali per sesi; reload / kunjungan ulang di sesi yang sama = versi kilat (±1 detik)
        var QUICK = false;
        try { QUICK = sessionStorage.getItem('hk_intro_seen') === '1'; sessionStorage.setItem('hk_intro_seen', '1'); } catch (e) {}
        if (QUICK) el.classList.add('quick');

        /* ── Huruf HIKIMORI (disembunyikan; muncul saat partikel selesai menyusunnya) ── */
        var TXT = 'HIKIMORI', w = document.getElementById('intro-word'), letters = [];
        for (var i = 0; i < TXT.length; i++) {
          var s = document.createElement('span'), c = document.createElement('i');
          c.textContent = TXT[i]; if (i === 4) c.className = 'y';
          s.appendChild(c); w.appendChild(s); letters.push(c);
        }
        var stage = document.getElementById('intro-stage');
        var d0 = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
        document.getElementById('intro-clock').textContent = pad(d0.getHours()) + ':' + pad(d0.getMinutes()) + ':' + pad(d0.getSeconds());

        /* ── Timeline (detik) ── */
        var T = LITE
          ? { splash: .45, swirl: .95, letter0: 1.45, step: .17, form: .45, fade: .55 }
          : { splash: .55, swirl: 1.15, letter0: 1.85, step: .24, form: .55, fade: .7 };
        var lastOn = T.letter0 + (TXT.length - 1) * T.step + T.form;
        var MIN = reduce ? 500 : QUICK ? 950 : Math.round((lastOn + (LITE ? .55 : .85)) * 1000);
        var t0 = performance.now(), ready = false, done = false, running = true;

        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { running = false; el.parentNode && el.parentNode.removeChild(el); }, 1100);
        }
        var scheduled = false;
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 9000); // pengaman bila JS aplikasi gagal dimuat

        // Log HUD + bar loading (persen naik sampai 100% tepat saat kata selesai)
        var logs = document.getElementById('intro-log').children, bar = document.getElementById('intro-bar'), pct = document.getElementById('intro-pct');
        function hud(t) {
          var k = Math.min(1, t / lastOn);
          bar.style.transform = 'scaleX(' + k + ')'; pct.textContent = Math.round(k * 100) + '%';
          for (var j = 0; j < logs.length; j++) if (t > .25 + j * (lastOn / logs.length)) logs[j].classList.add('on');
        }
        if (reduce || QUICK) { hud(lastOn); letters.forEach(function (l) { l.classList.add('on'); }); stage.classList.add('done'); return; }

        /* ════════ Hujan kode + partikel data neon (canvas 2D) ════════ */
        var cv = document.getElementById('intro-paint'), ctx = cv.getContext('2d');
        var DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5), W = 0, H = 0;
        var FS = LITE ? 14 : 15, cols = [];
        function size() {
          W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          var n = Math.ceil(W / (FS * (LITE ? 1.6 : 1.15))); cols = [];
          for (var q = 0; q < n; q++) cols.push({ y: -Math.random() * H, v: .5 + Math.random() * 1.1 });
        }
        size(); addEventListener('resize', size);
        var GLYPH = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ<>/{}#$%&HK';

        // Warna neon: cyan, magenta, kuning khas situs
        var COLORS = ['#00F0FF', '#00F0FF', '#7DF9FF', '#FF2A6D', '#FF2A6D', '#F4CB4D', '#E9FBFF'];
        var N = LITE ? 240 : 620, DROPS = LITE ? 50 : 180, P = [];
        var cx = W / 2, cy = H / 2;
        function center() { var r = w.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
        center();
        var mark = document.getElementById('intro-mark').getBoundingClientRect();
        var ox = mark.left + mark.width / 2, oy = mark.top + mark.height / 2; // data meledak dari logo

        function rnd(a, b) { return a + Math.random() * (b - a); }
        for (var n = 0; n < N + DROPS; n++) {
          var drop = n >= N;
          P.push({ x: ox, y: oy, vx: 0, vy: 0, r: drop ? rnd(1, 2.2) : rnd(2.2, 4.6), r0: 0, c: (Math.random() * COLORS.length) | 0,
            a: 0, born: T.splash + Math.random() * .35, drop: drop, g: drop ? -1 : n % TXT.length, tx: 0, ty: 0, mode: 0 });
        }

        // Titik-titik target tiap huruf (sampling bentuk huruf dari canvas kecil)
        function sample(i) {
          var span = letters[i].parentNode, r = span.getBoundingClientRect(), cs = getComputedStyle(letters[i]);
          var fs = parseFloat(cs.fontSize), o = document.createElement('canvas'), ow = Math.ceil(r.width), oh = Math.ceil(r.height);
          o.width = ow; o.height = oh; var g = o.getContext('2d');

          g.fillStyle = '#fff'; g.fillText(TXT[i], ow / 2, oh / 2 + fs * .04);
          var d = g.getImageData(0, 0, ow, oh).data, pts = [], st = Math.max(2, Math.round(fs / 24));
          for (var y = 0; y < oh; y += st) for (var x = 0; x < ow; x += st) if (d[(y * ow + x) * 4 + 3] > 110) pts.push([r.left + x, r.top + y]);
          return pts;
        }
        var formed = [];
        function startLetter(i) {
          center();
          var pts = sample(i), grp = P.filter(function (p) { return p.g === i; });
          if (!pts.length) return;
          for (var k = grp.length - 1; k > 0; k--) { var j = (Math.random() * (k + 1)) | 0, t = grp[k]; grp[k] = grp[j]; grp[j] = t; }
          grp.forEach(function (p, k) { var q = pts[Math.floor(k * pts.length / grp.length)]; p.tx = q[0]; p.ty = q[1]; p.mode = 2; p.mt = 0; });
        }

        var last = performance.now();
        function frame(now) {
          if (!running) return;
          var dt = Math.min(2.5, (now - last) / 16.67); last = now;
          var t = (now - t0) / 1000;
          hud(t);

          // Jejak memudar (trail)
          ctx.globalCompositeOperation = 'destination-out'; // pudarkan jejak tanpa menutup lantai grid di belakang
          ctx.fillStyle = 'rgba(0,0,0,.2)';
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = 'source-over';

          // Hujan kode digital
          ctx.font = '500 ' + FS + 'px ui-monospace,Consolas,monospace'; ctx.textAlign = 'center';
          var colW = W / cols.length;
          for (var q = 0; q < cols.length; q++) {
            var cl = cols[q]; cl.y += cl.v * FS * .32 * dt;
            if (cl.y > H + FS * 4) { cl.y = -rnd(0, H * .5); cl.v = .5 + Math.random() * 1.1; }
            var gx = q * colW + colW / 2;
            ctx.fillStyle = q % 5 === 0 ? 'rgba(255,42,109,.55)' : 'rgba(0,240,255,.4)';
            ctx.fillText(GLYPH[(Math.random() * GLYPH.length) | 0], gx, cl.y - FS);
            ctx.fillStyle = 'rgba(233,251,255,.85)';
            ctx.fillText(GLYPH[(Math.random() * GLYPH.length) | 0], gx, cl.y);
          }

          // Huruf mulai disusun satu per satu
          for (var i = 0; i < TXT.length; i++) {
            var ls = T.letter0 + i * T.step;
            if (t >= ls && !formed[i]) { formed[i] = 1; startLetter(i); }
            if (t >= ls + T.form && formed[i] === 1) { formed[i] = 2; letters[i].classList.add('on'); }
          }
          if (t >= lastOn && !stage.classList.contains('done')) stage.classList.add('done');
          if (t >= lastOn + .5 && !cv.classList.contains('dry')) cv.classList.add('dry');

          ctx.globalCompositeOperation = 'lighter';
          var swirl = t > T.swirl, R = Math.max(40, Math.min(W, H) * (.36 - Math.min(.2, (t - T.swirl) * .09)));
          for (var k = 0; k < P.length; k++) {
            var p = P[k];
            if (t < p.born) continue;
            if (p.mode === 0) { // LEDAKAN DATA dari logo ke segala arah
              var ang = rnd(0, 6.283), sp = p.drop ? rnd(8, 22) : rnd(3, 12);
              p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp; p.mode = 1; p.a = p.drop ? .9 : .8;
            }
            if (p.mode === 1) {
              if (swirl) { // ORBIT mengelilingi pusat kata
                var dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
                var tang = (p.drop ? .9 : .55) * dt, pull = (d - R * (.6 + (k % 7) * .07)) * .0035 * dt;
                p.vx += (-dy / d) * tang - (dx / d) * pull * 6; p.vy += (dx / d) * tang - (dy / d) * pull * 6;
                p.vx *= Math.pow(.955, dt); p.vy *= Math.pow(.955, dt);
              } else { p.vx *= Math.pow(.93, dt); p.vy *= Math.pow(.93, dt); }
              if (p.drop && t > lastOn - .3) p.a -= .02 * dt;
            } else if (p.mode === 2) { // MENYUSUN HURUF: pegas ke titik bentuk huruf
              p.mt += dt / 60;
              p.vx = (p.vx + (p.tx - p.x) * .085 * dt) * Math.pow(.8, dt);
              p.vy = (p.vy + (p.ty - p.y) * .085 * dt) * Math.pow(.8, dt);
              var targetR = Math.max(1.4, p.r0 * .5); p.r += (targetR - p.r) * .08 * dt;
              if (p.mt > T.form + .15) { p.a -= (1 / (T.fade * 60)) * dt; } // partikel padam, huruf neon yang tersisa
            }
            p.x += p.vx * dt; p.y += p.vy * dt;
            if (p.a <= 0) continue;
            ctx.globalAlpha = Math.min(1, p.a);
            ctx.fillStyle = COLORS[p.c];
            var rr = p.r * 2;
            ctx.fillRect(p.x - rr / 2, p.y - rr / 2, rr, rr); // piksel data kotak
            if (!LITE && p.mode === 1 && !p.drop) { ctx.globalAlpha = Math.min(1, p.a) * .18; ctx.fillRect(p.x - rr * 1.5, p.y - rr * 1.5, rr * 3, rr * 3); } // pendar
          }
          ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
          requestAnimationFrame(frame); // hujan kode jalan terus sampai intro ditutup
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
