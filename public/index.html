    <!-- ═══ Intro: monogram HK + cat air yang muncrat → berputar → membentuk HIKIMORI huruf demi huruf (tiap buka / reload) ═══ -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#F4F2EC;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer}
      #intro .pane{position:absolute;left:0;right:0;height:50.5%;background:#121211;transition:transform 1s cubic-bezier(.77,0,.18,1)}
      #intro .pane.t{top:0}#intro .pane.b{bottom:0}
      #intro .glow{position:absolute;width:110vmax;height:110vmax;border-radius:50%;background:radial-gradient(circle,rgba(244,203,77,.16) 0%,rgba(244,203,77,.04) 30%,transparent 56%);opacity:0;animation:hkFade 2s ease-out .3s forwards}
      #intro canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s ease}
      #intro canvas.dry{opacity:0}
      #intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.4vh,30px);transition:transform 1s cubic-bezier(.77,0,.18,1),opacity .6s ease}
      /* Monogram HK — dirakit dari piksel, semua animasi transform/opacity (ringan) */
      #intro .mark{width:clamp(130px,22vw,190px);color:#F4F2EC;filter:drop-shadow(0 10px 30px rgba(42,70,255,.25))}
      #intro .mark svg{display:block;width:100%;height:auto;overflow:visible}
      #intro .mark .px{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4);transform-box:fill-box;transform-origin:center;animation:hkPx .7s cubic-bezier(.2,1,.3,1) forwards}
      #intro .mark .hb{opacity:0;transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;animation:hkBar .55s cubic-bezier(.2,1,.3,1) forwards}
      #intro .mark .box{opacity:0;transform:scale(.7) rotate(-8deg);transform-box:fill-box;transform-origin:center;animation:hkBox .7s cubic-bezier(.2,1.25,.3,1) .45s forwards}
      #intro .mark .chev{opacity:0;transform:translateX(30px);transform-box:fill-box;animation:hkChev .55s cubic-bezier(.2,1,.3,1) .7s forwards}
      #intro .mark .cur{opacity:0;animation:hkBlink 1s steps(1) 1.1s infinite}
      /* Huruf HIKIMORI: muncul tepat di atas cat yang membentuknya */
      #intro .word{display:flex;font-weight:300;font-size:clamp(2.4rem,9.5vw,5rem);letter-spacing:.24em;margin-right:-.24em;line-height:1;position:relative}
      #intro .word span{display:inline-block;padding:.06em 0;position:relative}
      #intro .word i{display:inline-block;font-style:normal;opacity:0;transform:scale(.86);transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.2,.3,1),color 1.2s ease,text-shadow 1.2s ease;color:#F4CB4D;text-shadow:0 0 22px rgba(244,203,77,.55)}
      #intro .word i.on{opacity:1;transform:none;color:#F4F2EC;text-shadow:0 0 0 transparent}
      #intro .word i.y.on{color:#F4CB4D}
      #intro .line{width:min(320px,60vw);height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#F4CB4D,transparent);transform:scaleX(0);transition:transform .8s cubic-bezier(.65,0,.35,1)}
      #intro .sub{font-size:.72rem;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:rgba(244,242,236,.55);opacity:0;transform:translateY(8px);transition:opacity .7s ease .15s,transform .7s ease .15s}
      #intro .stage.done .line{transform:scaleX(1)}#intro .stage.done .sub{opacity:1;transform:none}
      #intro .skip{position:absolute;bottom:22px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,242,236,.35);opacity:0;animation:hkFade .5s ease 1.2s forwards}
      #intro.out .pane.t{transform:translateY(-101%)}#intro.out .pane.b{transform:translateY(101%)}
      #intro.out .stage{transform:scale(1.1);opacity:0}
      #intro.out canvas,#intro.out .glow,#intro.out .skip{opacity:0!important;transition:opacity .45s}
      #intro.out{pointer-events:none}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      @keyframes hkFade{to{opacity:1}}
      @keyframes hkPx{to{opacity:var(--o,1);transform:none}}
      @keyframes hkBar{to{opacity:1;transform:none}}
      @keyframes hkBox{to{opacity:1;transform:none}}
      @keyframes hkChev{to{opacity:1;transform:none}}
      @keyframes hkBlink{0%{opacity:1}50%{opacity:0}}
      html.lite #intro .mark{filter:none}
      /* Versi kilat (reload di sesi yang sama): tanpa cat, logo & kata langsung tampil */
      #intro.quick .mark .px,#intro.quick .mark .hb,#intro.quick .mark .box,#intro.quick .mark .chev{animation-duration:.35s;animation-delay:0s!important}
      #intro.quick .word i{transition-duration:.35s}#intro.quick .skip{display:none}
      @media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.2s!important}}
    </style>

    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var LITE = root.classList.contains('lite');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Intro penuh hanya sekali per sesi; reload / kunjungan ulang di sesi yang sama = versi kilat (±1 detik)
        var QUICK = false;
        try { QUICK = sessionStorage.getItem('hk_intro_seen') === '1'; sessionStorage.setItem('hk_intro_seen', '1'); } catch (e) {}
        if (QUICK) el.classList.add('quick');

        /* ── Piksel pecahan huruf H: terbang dari arah acak lalu merakit ── */
        var PX = [[30,22,10,.95],[16,34,8,.7],[34,44,9,.85],[6,52,6,.45],[22,60,8,.75],[36,70,7,.9],[12,78,9,.55],[28,88,8,.8],[2,96,5,.35],[18,104,7,.6],[34,112,9,.9],[10,120,6,.4],[26,128,6,.65]];
        var pxg = document.getElementById('intro-px'), NS = 'http://www.w3.org/2000/svg';
        PX.forEach(function (p, i) {
          var r = document.createElementNS(NS, 'rect');
          r.setAttribute('x', p[0]); r.setAttribute('y', p[1]); r.setAttribute('width', p[2]); r.setAttribute('height', p[2]);
          r.setAttribute('class', 'px');
          r.style.setProperty('--dx', (-60 - Math.random() * 140) + 'px'); r.style.setProperty('--dy', ((Math.random() - .5) * 160) + 'px');
          r.style.setProperty('--o', p[3]); r.style.animationDelay = (i * 0.025) + 's';
          pxg.appendChild(r);
        });

        /* ── Huruf HIKIMORI (disembunyikan; muncul saat cat selesai membentuknya) ── */
        var TXT = 'HIKIMORI', w = document.getElementById('intro-word'), letters = [];
        for (var i = 0; i < TXT.length; i++) {
          var s = document.createElement('span'), c = document.createElement('i');
          c.textContent = TXT[i]; if (i === 4) c.className = 'y';
          s.appendChild(c); w.appendChild(s); letters.push(c);
        }
        var stage = document.getElementById('intro-stage');

        /* ── Timeline (detik) ── */
        var T = LITE
          ? { splash: .45, swirl: .95, letter0: 1.45, step: .17, form: .45, fade: .55 }
          : { splash: .55, swirl: 1.15, letter0: 1.85, step: .24, form: .55, fade: .7 };
        var lastOn = T.letter0 + (TXT.length - 1) * T.step + T.form;
        var MIN = reduce ? 500 : QUICK ? 950 : Math.round((lastOn + (LITE ? .55 : .85)) * 1000);
        var t0 = performance.now(), ready = false, done = false, running = true;

        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { running = false; el.parentNode && el.parentNode.removeChild(el); }, 1100);
        }
        var scheduled = false;
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 9000); // pengaman bila JS aplikasi gagal dimuat

        if (reduce || QUICK) { letters.forEach(function (l) { l.classList.add('on'); }); stage.classList.add('done'); return; }

        /* ════════ Cat air (canvas 2D) ════════ */
        var cv = document.getElementById('intro-paint'), ctx = cv.getContext('2d');
        var DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5), W = 0, H = 0;
        function size() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
        size(); addEventListener('resize', size);

        // Warna: kuning-amber khas situs + biru dari logo
        var COLORS = ['#F4CB4D', '#F4CB4D', '#F2B33D', '#F7E2A0', '#E8894A', '#3F5BFF', '#8EA0FF'];
        // Sprite "tetesan cat air": tepi lebih pekat (efek pigmen mengering), tengah transparan, sedikit tidak rata
        function sprite(col) {
          var S = 64, o = document.createElement('canvas'); o.width = o.height = S; var g = o.getContext('2d');
          for (var k = 0; k < 4; k++) {
            var ox = S / 2 + (Math.random() - .5) * 8, oy = S / 2 + (Math.random() - .5) * 8, r = S * (.3 + Math.random() * .14);
            var gr = g.createRadialGradient(ox, oy, 0, ox, oy, r);
            gr.addColorStop(0, col + '22'); gr.addColorStop(.72, col + '55'); gr.addColorStop(.9, col + '99'); gr.addColorStop(1, col + '00');
            g.fillStyle = gr; g.beginPath(); g.arc(ox, oy, r, 0, 6.283); g.fill();
          }
          return o;
        }
        var SPR = COLORS.map(sprite);

        var N = LITE ? 240 : 640, DROPS = LITE ? 60 : 220, P = [];
        var cx = W / 2, cy = H / 2;
        function center() { var r = w.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
        center();
        var mark = document.getElementById('intro-mark').getBoundingClientRect();
        var ox = mark.left + mark.width / 2, oy = mark.top + mark.height / 2; // cat muncrat dari logo

        function rnd(a, b) { return a + Math.random() * (b - a); }
        for (var n = 0; n < N + DROPS; n++) {
          var drop = n >= N;
          P.push({ x: ox, y: oy, vx: 0, vy: 0, r: drop ? rnd(1.2, 3.2) : rnd(5, 15), r0: 0, c: (Math.random() * COLORS.length) | 0,
            a: 0, born: T.splash + Math.random() * .35, drop: drop, g: drop ? -1 : n % TXT.length, tx: 0, ty: 0, mode: 0 });
        }
        P.forEach(function (p) { p.r0 = p.r; });

        // Titik-titik target tiap huruf (sampling bentuk huruf dari canvas kecil)
        function sample(i) {
          var span = letters[i].parentNode, r = span.getBoundingClientRect(), cs = getComputedStyle(letters[i]);
          var fs = parseFloat(cs.fontSize), o = document.createElement('canvas'), ow = Math.ceil(r.width), oh = Math.ceil(r.height);
          o.width = ow; o.height = oh; var g = o.getContext('2d');
          g.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillStyle = '#fff'; g.fillText(TXT[i], ow / 2, oh / 2 + fs * .04);
          var d = g.getImageData(0, 0, ow, oh).data, pts = [], st = Math.max(2, Math.round(fs / 24));
          for (var y = 0; y < oh; y += st) for (var x = 0; x < ow; x += st) if (d[(y * ow + x) * 4 + 3] > 110) pts.push([r.left + x, r.top + y]);
          return pts;
        }
        var formed = [];
        function startLetter(i) {
          center();
          var pts = sample(i), grp = P.filter(function (p) { return p.g === i; });
          if (!pts.length) return;
          for (var k = grp.length - 1; k > 0; k--) { var j = (Math.random() * (k + 1)) | 0, t = grp[k]; grp[k] = grp[j]; grp[j] = t; }
          grp.forEach(function (p, k) { var q = pts[Math.floor(k * pts.length / grp.length)]; p.tx = q[0] + rnd(-1.5, 1.5); p.ty = q[1] + rnd(-1.5, 1.5); p.mode = 2; p.mt = 0; });
        }

        var last = performance.now();
        function frame(now) {
          if (!running) return;
          var dt = Math.min(2.5, (now - last) / 16.67); last = now;
          var t = (now - t0) / 1000;

          // Bekas cat memudar perlahan → jejak sapuan kuas
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = LITE ? 'rgba(18,18,17,.16)' : 'rgba(18,18,17,.11)';
          ctx.fillRect(0, 0, W, H);

          // Huruf mulai dibentuk satu per satu
          for (var i = 0; i < TXT.length; i++) {
            var ls = T.letter0 + i * T.step;
            if (t >= ls && !formed[i]) { formed[i] = 1; startLetter(i); }
            if (t >= ls + T.form && formed[i] === 1) { formed[i] = 2; letters[i].classList.add('on'); }
          }
          if (t >= lastOn && !stage.classList.contains('done')) stage.classList.add('done');
          // Setelah kata lengkap, sisa jejak cat dihapus total (tidak meninggalkan noda abu-abu)
          if (t >= lastOn + .5 && !cv.classList.contains('dry')) cv.classList.add('dry');

          var swirl = t > T.swirl, R = Math.max(40, Math.min(W, H) * (.36 - Math.min(.2, (t - T.swirl) * .09)));
          for (var k = 0; k < P.length; k++) {
            var p = P[k];
            if (t < p.born) continue;
            if (p.mode === 0) { // MUNCRAT: tembakan dari logo ke segala arah
              var ang = rnd(0, 6.283), sp = p.drop ? rnd(8, 22) : rnd(3, 12);
              p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp - (p.drop ? 2 : 0); p.mode = 1; p.a = p.drop ? .9 : .7;
            }
            if (p.mode === 1) {
              if (swirl) { // PUSARAN: berputar perlahan mengelilingi pusat kata
                var dx = p.x - cx, dy = p.y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
                var tang = (p.drop ? .9 : .55) * dt, pull = (d - R * (.6 + (k % 7) * .07)) * .0035 * dt;
                p.vx += (-dy / d) * tang - (dx / d) * pull * 6; p.vy += (dx / d) * tang - (dy / d) * pull * 6;
                p.vx *= Math.pow(.955, dt); p.vy *= Math.pow(.955, dt);
              } else { p.vx *= Math.pow(.93, dt); p.vy = p.vy * Math.pow(.93, dt) + (p.drop ? .18 : .05) * dt; }
              if (p.drop && t > lastOn - .3) p.a -= .02 * dt;
            } else if (p.mode === 2) { // MEMBENTUK HURUF: pegas ke titik bentuk huruf
              p.mt += dt / 60;
              p.vx = (p.vx + (p.tx - p.x) * .085 * dt) * Math.pow(.8, dt);
              p.vy = (p.vy + (p.ty - p.y) * .085 * dt) * Math.pow(.8, dt);
              var targetR = Math.max(2.2, p.r0 * .42); p.r += (targetR - p.r) * .08 * dt;
              if (p.mt > T.form + .15) { p.a -= (1 / (T.fade * 60)) * dt; } // cat meresap, huruf tajam yang tersisa
            }
            p.x += p.vx * dt; p.y += p.vy * dt;
            if (p.a <= 0) continue;
            ctx.globalAlpha = Math.min(1, p.a);
            var rr = p.r * 2.2;
            ctx.drawImage(SPR[p.c], p.x - rr / 2, p.y - rr / 2, rr, rr);
          }
          ctx.globalAlpha = 1;
          if (t < lastOn + 1.4) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
