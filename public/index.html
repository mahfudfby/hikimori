    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;color:#EEF4FA;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;--cy:#9EE6F2;--mg:#F3B4CF;--lv:#BCAEF6;--yl:#F4D58A;--ez:cubic-bezier(.22,1,.36,1)}

      #intro .load{position:absolute;bottom:clamp(44px,8vh,70px);width:min(280px,62vw);font:400 .58rem/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:rgba(238,244,250,.5);text-transform:uppercase;opacity:0;animation:hkFade 1.4s ease .8s forwards}
      #intro .load .irow{display:flex;justify-content:space-between}

      #intro .skip{position:absolute;bottom:18px;font:400 .58rem/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(238,244,250,.3);opacity:0;animation:hkFade 1.4s ease 1.8s forwards}
      #intro.out .pane.t{transform:translateY(-101%)}#intro.out .pane.b{transform:translateY(101%)}
      #intro.out .stage{transform:scale(1.06);opacity:0}
      #intro.out canvas,#intro.out .hud,#intro.out .load,#intro.out .skip{opacity:0!important;transition:opacity .8s ease}
      #intro.out{pointer-events:none}
      #intro.mt .mark .box{animation-delay:var(--lg)}#intro.mt .mark::after{animation-delay:calc(var(--lg) + .6s),0s}#intro.mt .mark .ring{animation-delay:calc(var(--lg) + .3s)}#intro.mt .mark .ring.r2{animation-delay:calc(var(--lg) + 1.9s)}#intro.mt .mark .tag{animation-delay:calc(var(--lg) + 1s)}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      @keyframes hkFade{to{opacity:1}}
      @keyframes goldGlare{0%,100%{background-position:100% 0}50%{background-position:0 0}}
      @keyframes cyDraw{to{transform:scaleX(1)}}
      @keyframes cyFloor{to{background-position:0 48px,0 0}}
      @keyframes cySoft{to{opacity:1;transform:none;filter:none}}
      @keyframes cyRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
      html.lite #intro .mark .ring.r2{display:none}
      /* Versi kilat (reload di sesi yang sama): tanpa partikel, logo & kata langsung tampil */
      #intro.quick .mark .box,#intro.quick .mark::after{animation-duration:.5s;animation-delay:0s!important}

    <script>
      (function () {
        var el = document.getElementById('intro'); if (!el) return;
        if (location.pathname.indexOf('/admin') === 0) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement; root.classList.add('intro-lock');
        var LITE = root.classList.contains('lite');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Intro penuh hanya sekali per sesi; reload / kunjungan ulang di sesi yang sama = versi kilat (±1 detik)
        var QUICK = false;
        try { QUICK = sessionStorage.getItem('hk_intro_seen') === '1'; sessionStorage.setItem('hk_intro_seen', '1'); } catch (e) {}
        if (QUICK) el.classList.add('quick');

        /* ── Huruf HIKIMORI (disembunyikan; muncul saat partikel selesai menyusunnya) ── */
        var TXT = 'HIKIMORI', w = document.getElementById('intro-word'), letters = [];
        for (var i = 0; i < TXT.length; i++) {
          var s = document.createElement('span'), c = document.createElement('i');
          c.textContent = TXT[i]; if (i === 4) c.className = 'y';
          s.appendChild(c); w.appendChild(s); letters.push(c);
        }
        // Nama per huruf (ikut dibentuk serpihan meteor)
        var NAME = 'Mahfud Febry Styanto', sub = document.getElementById('intro-sub'), nameEls = [];
        for (var n0 = 0; n0 < NAME.length; n0++) {
          var s2 = document.createElement('span'), c2 = document.createElement('i');
          c2.textContent = NAME[n0] === ' ' ? ' ' : NAME[n0]; s2.appendChild(c2); sub.appendChild(s2); nameEls.push(c2);
        }
        var stage = document.getElementById('intro-stage');
        var d0 = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
        document.getElementById('intro-clock').textContent = pad(d0.getHours()) + ':' + pad(d0.getMinutes());

        /* ── Timeline slow-motion (detik) ── */
        var T = LITE
          ? { logo: 2.1, letter0: 2.2, step: .2, form: .75, fade: .9 }
          : { logo: 2.6, letter0: 2.7, step: .26, form: .9, fade: 1.1 };
        var lastOn = T.letter0 + (TXT.length - 1) * T.step + T.form;
        var letterOn = letters.map(function (_, i) { return T.letter0 + i * T.step + T.form * .7; });
        var nameOn = nameEls.map(function (_, j) { return lastOn + .1 + j * (LITE ? .025 : .035); });
        var nameEnd = nameOn[nameOn.length - 1];
        var MIN = reduce ? 500 : QUICK ? 1000 : Math.round((nameEnd + 2.1) * 1000); // 1,1 dtk transisi huruf terakhir + 1 dtk teks tampil sempurna
        var t0 = performance.now(), ready = false, done = false, running = true;

        function close() {
          if (done) return; done = true;
          el.classList.add('out'); root.classList.remove('intro-lock');
          setTimeout(function () { running = false; el.parentNode && el.parentNode.removeChild(el); }, 1600);
        }
        var scheduled = false;
        function tryClose() { if (ready && !scheduled) { scheduled = true; setTimeout(close, Math.max(0, MIN - (performance.now() - t0))); } }
        window.__hkIntroDone = function () { ready = true; tryClose(); };
        el.addEventListener('click', close);
        setTimeout(close, 11000); // pengaman bila JS aplikasi gagal dimuat

        // Log HUD + bar loading (naik halus sampai 100% tepat saat kata selesai)
        var logs = document.getElementById('intro-log').children, bar = document.getElementById('intro-bar'), pct = document.getElementById('intro-pct');
        function hud(t) {
          var k = Math.min(1, t / lastOn), e = 1 - Math.pow(1 - k, 3);
          bar.style.transform = 'scaleX(' + e + ')'; pct.textContent = Math.round(e * 100) + '%';
          for (var j = 0; j < logs.length; j++) if (t > .6 + j * (lastOn / (logs.length + 1))) logs[j].classList.add('on');
        }
        if (reduce || QUICK) { hud(lastOn); letters.concat(nameEls).forEach(function (l) { l.classList.add('on'); }); stage.classList.add('done'); return; }

        /* ════════ Hujan meteor: melesat dari luar layar, meledak memenuhi layar, serpihannya memusat jadi logo, HIKIMORI & nama (canvas 2D) ════════ */
        var cv = document.getElementById('intro-paint'), ctx = cv.getContext('2d');
        var DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5), W = 0, H = 0;
        function rnd(a, b) { return a + Math.random() * (b - a); }
        function size() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.lineCap = 'round'; }
        size();
        var COL = ['#FF6FB5', '#C77DFF', '#4FF0FF', '#4C8DFF']; // pink, saber (ungu laser), cyan, biru
        function pick() { return COL[(Math.random() * COL.length) | 0]; }
        var SC = Math.min(1, Math.max(.5, Math.min(W, H) / 800)); // HP: meteor & serpihan lebih kecil
        el.style.setProperty('--lg', (T.logo - .3) + 's'); // logo baru muncul saat serpihan memusat
        el.classList.add('mt');

        // Titik-titik bentuk satu huruf (sampling dari canvas kecil), dibatasi maksimal `cap` titik
        function sample(el, ch, cap) {
          var span = el.parentNode, r = span.getBoundingClientRect(), cs = getComputedStyle(el);
          var fs = parseFloat(cs.fontSize), ow = Math.ceil(r.width), oh = Math.ceil(r.height);
          if (!ow || !oh || ch === ' ') return { pts: [], st: 1, sp: span };
          var o = document.createElement('canvas'); o.width = ow; o.height = oh; var g = o.getContext('2d');
          g.font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillStyle = '#fff'; g.fillText(ch, ow / 2, oh / 2 + fs * .04);
          var d = g.getImageData(0, 0, ow, oh).data, pts = [], st = Math.max(1, Math.round(fs / 22));
          for (var y = 0; y < oh; y += st) for (var x = 0; x < ow; x += st) if (d[(y * ow + x) * 4 + 3] > 110) pts.push([x, y]);
          for (var k = pts.length - 1; k > 0; k--) { var j = (Math.random() * (k + 1)) | 0, tp = pts[k]; pts[k] = pts[j]; pts[j] = tp; }
          return { pts: pts.slice(0, cap), st: st, sp: span };
        }

        // Meteor: titik ledak disebar merata (grid acak) sampai ke tepi layar, arah datang acak
        var CX = LITE ? 4 : 6, CY = LITE ? 4 : 5, M = [], cells = [], SPAN = LITE ? 1.0 : 1.3;
        for (var gy = 0; gy < CY; gy++) for (var gx = 0; gx < CX; gx++) cells.push([gx, gy]);
        cells.sort(function () { return Math.random() - .5; });
        cells.forEach(function (c, i) {
          var ex = (c[0] + rnd(.08, .92)) / CX * W, ey = (c[1] + rnd(.08, .92)) / CY * H, a = rnd(0, 6.283), L = Math.max(W, H) * rnd(.5, .9);
          var ts = .1 + i / cells.length * SPAN + rnd(0, .12);
          M.push({ sx: ex - Math.cos(a) * L, sy: ey - Math.sin(a) * L, ex: ex, ey: ey, ts: ts, te: ts + rnd(.45, .8), c: pick(), px: null, py: null, boom: 0 });
        });
        var S = [], F = [], P = []; // S: serpihan ledakan, F: kilatan cincin, P: serpihan yang memusat ke bentuk
        function explode(m, t) {
          F.push({ x: m.ex, y: m.ey, t0: t, c: m.c });
          for (var k = 0, n = LITE ? 18 : 34; k < n; k++) {
            var a = rnd(0, 6.283), sp = rnd(140, 820) * SC;
            S.push({ x: m.ex, y: m.ey, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t0: t, life: rnd(.6, 1.3), c: Math.random() < .2 ? '#fff' : Math.random() < .6 ? m.c : pick() });
          }
        }
        // Serpihan memusat: berangkat dari titik ledakan yang sudah terjadi, tiba di titik bentuk tepat waktu `arr`
        var CDUR = LITE ? 1.1 : 1.3;
        function launch(t, arr, sp, ox, oy, r) {
          var b = M.filter(function (m) { return m.te <= t; }); if (!b.length) b = M;
          var m = b[(Math.random() * b.length) | 0], sx = m.ex + rnd(-90, 90) * SC, sy = m.ey + rnd(-90, 90) * SC;
          var rr = sp ? sp.getBoundingClientRect() : { left: 0, top: 0 }, tx = rr.left + ox, ty = rr.top + oy;
          P.push({ sp: sp, ox: ox, oy: oy, sx: sx, sy: sy, cx: (sx + tx) / 2 + rnd(-220, 220) * SC, cy: (sy + ty) / 2 + rnd(-220, 220) * SC,
            s: t, d: Math.max(.3, arr - t), r: r, c: pick(), px: sx, py: sy });
        }
        var groups = [], mk = document.getElementById('intro-mark');
        groups.push({ at: T.logo - CDUR, build: function (t) { // logo
          var r = mk.getBoundingClientRect();
          for (var k = 0, n = LITE ? 70 : 150; k < n; k++) {
            var a = rnd(0, 6.283), q = Math.sqrt(Math.random());
            launch(t, T.logo, null, r.left + r.width / 2 + Math.cos(a) * q * r.width / 2, r.top + r.height / 2 + Math.sin(a) * q * r.height / 2, rnd(1, 2.2) * SC + .3);
          }
        } });
        letterOn.forEach(function (at, i) { // HIKIMORI
          groups.push({ at: at - .15 - CDUR, build: function (t) {
            sample(letters[i], TXT[i], LITE ? 28 : 46).pts.forEach(function (q, _, a) { launch(t, at - .15, letters[i].parentNode, q[0], q[1], rnd(1.2, 2.2) * SC + .4); });
          } });
        });
        nameOn.forEach(function (at, j) { // nama
          groups.push({ at: at - .1 - CDUR * .8, build: function (t) {
            sample(nameEls[j], NAME[j].toUpperCase(), LITE ? 10 : 20).pts.forEach(function (q) { launch(t, at - .1, nameEls[j].parentNode, q[0], q[1], rnd(.7, 1.1)); });
          } });
        });

        var spans = letters.concat(nameEls).map(function (el) { return el.parentNode; }), last = 0;
        function line(x0, y0, x1, y1, w, c, a) { ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
        function dot(x, y, r, c, a) { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }

        function frame(now) {
          if (!running) return;
          var t = (now - t0) / 1000, dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now;
          hud(t);
          for (var gi = 0; gi < groups.length; gi++) if (!groups[gi].done && t >= groups[gi].at) { groups[gi].done = 1; groups[gi].build(t); }

          // Huruf & nama muncul tepat saat serpihan selesai memusat di bentuknya
          for (var i = 0; i < letters.length; i++) if (t >= letterOn[i]) letters[i].classList.add('on');
          if (t >= lastOn && !stage.classList.contains('done')) stage.classList.add('done');
          for (var j = 0; j < nameEls.length; j++) if (t >= nameOn[j]) nameEls[j].classList.add('on');
          if (t >= nameEnd + .35 && !cv.classList.contains('dry')) cv.classList.add('dry'); // cahaya surut, teks tajam tersisa
          spans.forEach(function (sp) { sp._r = sp.getBoundingClientRect(); });

          // Gambar lama memudar pelan → ekor cahaya
          ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(0,0,0,.24)'; ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = 'lighter';
          var n, k, e, x, y;
          for (n = 0; n < M.length; n++) { // meteor melesat (makin cepat), meledak di tujuan
            var m = M[n]; if (t < m.ts || m.boom) continue;
            k = Math.min(1, (t - m.ts) / (m.te - m.ts)); e = k * k;
            x = m.sx + (m.ex - m.sx) * e; y = m.sy + (m.ey - m.sy) * e;
            if (m.px !== null) { line(m.px, m.py, x, y, 4 * SC + 1.5, m.c, .9); line(m.px, m.py, x, y, 1.4, '#fff', 1); }
            dot(x, y, 8 * SC + 2, m.c, .35);
            m.px = x; m.py = y;
            if (k >= 1) { m.boom = 1; explode(m, t); }
          }
          F = F.filter(function (f) { // kilatan cincin ledakan
            var a = (t - f.t0) / .45; if (a >= 1) return false;
            ctx.globalAlpha = 1 - a; ctx.strokeStyle = f.c; ctx.lineWidth = 2.5 * (1 - a) + .5;
            ctx.beginPath(); ctx.arc(f.x, f.y, 6 + 150 * SC * (1 - Math.pow(1 - a, 3)), 0, 6.283); ctx.stroke();
            if (a < .3) dot(f.x, f.y, 22 * SC * (1 - a / .3) + 2, '#fff', .8 * (1 - a / .3));
            return true;
          });
          var drag = Math.exp(-2.3 * dt);
          S = S.filter(function (s) { // serpihan terlempar sampai tepi layar
            var a = (t - s.t0) / s.life; if (a >= 1) return false;
            s.vx *= drag; s.vy = s.vy * drag + 70 * dt;
            var nx = s.x + s.vx * dt, ny = s.y + s.vy * dt;
            line(s.x, s.y, nx, ny, 1.8 * SC + .4, s.c, 1 - a);
            s.x = nx; s.y = ny; return true;
          });
          for (n = 0; n < P.length; n++) { // serpihan memusat (kurva bezier, pelan → cepat → pelan)
            var p = P[n], r = p.sp ? p.sp._r : { left: 0, top: 0 }, tx = r.left + p.ox, ty = r.top + p.oy;
            k = Math.min(1, (t - p.s) / p.d); e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
            var u = 1 - e; x = u * u * p.sx + 2 * u * e * p.cx + e * e * tx; y = u * u * p.sy + 2 * u * e * p.cy + e * e * ty;
            if (k < 1) line(p.px, p.py, x, y, p.r * 1.6, p.c, .9); else dot(x, y, p.r, p.c, .8);
            p.px = x; p.py = y;
          }
          ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
  </body>
